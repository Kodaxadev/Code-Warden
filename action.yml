name: Code-Warden Governance Gate
description: Run Code-Warden governance checks and publish PR-visible evidence.

inputs:
  path:
    description: Path to scan, relative to the workflow workspace.
    required: false
    default: .
  summary:
    description: Write a Markdown governance summary to GITHUB_STEP_SUMMARY.
    required: false
    default: 'true'
  upload-artifact:
    description: Upload .code-warden-report.json as a workflow artifact.
    required: false
    default: 'true'
  artifact-name:
    description: Artifact name for the governance report.
    required: false
    default: code-warden-report
  sarif:
    description: Upload source-located findings to GitHub Code Scanning.
    required: false
    default: 'false'
  sarif-file:
    description: SARIF output filename, relative to the workflow workspace.
    required: false
    default: code-warden.sarif
  sarif-category:
    description: Code scanning category for Code-Warden SARIF results.
    required: false
    default: code-warden
  config:
    description: Path to a codewarden.json config file in the repo. Overrides built-in defaults.
    required: false
    default: ''
  baseline:
    description: >-
      Path to a committed code-warden baseline file (write one locally with
      `npx code-warden report --write-baseline`). When set and the file
      exists, only NEW or WORSENED violations fail the gate; baselined legacy
      findings are reported but excluded from SARIF and the result.
    required: false
    default: ''

outputs:
  report-path:
    description: Path to the generated governance report.
    value: ${{ steps.report-path.outputs.path }}
  sarif-path:
    description: Path to the generated SARIF report.
    value: ${{ steps.sarif-path.outputs.path }}

branding:
  icon: shield
  color: red

runs:
  using: composite
  steps:
    - name: Resolve report path
      id: report-path
      shell: bash
      run: echo "path=${GITHUB_WORKSPACE}/.code-warden-report.json" >> "$GITHUB_OUTPUT"

    - name: Resolve SARIF path
      id: sarif-path
      shell: bash
      run: echo "path=${GITHUB_WORKSPACE}/${{ inputs.sarif-file }}" >> "$GITHUB_OUTPUT"

    - name: Run governance report
      id: governance
      continue-on-error: true
      shell: bash
      run: |
        CONFIG_FLAG=""
        if [ -n "${{ inputs.config }}" ] && [ -f "${{ inputs.config }}" ]; then
          CONFIG_FLAG="--config=${{ inputs.config }}"
        fi
        BASELINE_FLAG=""
        if [ -n "${{ inputs.baseline }}" ] && [ -f "${{ inputs.baseline }}" ]; then
          BASELINE_FLAG="--baseline=${{ inputs.baseline }}"
        fi
        node "${{ github.action_path }}/code-warden/tools/governance-report.js" "${{ inputs.path }}" $CONFIG_FLAG $BASELINE_FLAG

    - name: Publish governance summary
      if: ${{ always() && inputs.summary == 'true' }}
      shell: bash
      run: |
        CONFIG_FLAG=""
        if [ -n "${{ inputs.config }}" ] && [ -f "${{ inputs.config }}" ]; then
          CONFIG_FLAG="--config=${{ inputs.config }}"
        fi
        BASELINE_FLAG=""
        if [ -n "${{ inputs.baseline }}" ] && [ -f "${{ inputs.baseline }}" ]; then
          BASELINE_FLAG="--baseline=${{ inputs.baseline }}"
        fi
        node "${{ github.action_path }}/code-warden/tools/governance-report.js" "${{ inputs.path }}" --format=md $CONFIG_FLAG $BASELINE_FLAG >> "$GITHUB_STEP_SUMMARY" || true

    - name: Generate SARIF report
      if: ${{ always() && inputs.sarif == 'true' }}
      shell: bash
      run: |
        CONFIG_FLAG=""
        if [ -n "${{ inputs.config }}" ] && [ -f "${{ inputs.config }}" ]; then
          CONFIG_FLAG="--config=${{ inputs.config }}"
        fi
        BASELINE_FLAG=""
        if [ -n "${{ inputs.baseline }}" ] && [ -f "${{ inputs.baseline }}" ]; then
          BASELINE_FLAG="--baseline=${{ inputs.baseline }}"
        fi
        node "${{ github.action_path }}/code-warden/tools/governance-report.js" "${{ inputs.path }}" --format=sarif $CONFIG_FLAG $BASELINE_FLAG > "${{ steps.sarif-path.outputs.path }}" || true
        test -s "${{ steps.sarif-path.outputs.path }}"

    - name: Upload SARIF report
      if: ${{ always() && inputs.sarif == 'true' }}
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ steps.sarif-path.outputs.path }}
        category: ${{ inputs.sarif-category }}

    - name: Upload governance artifact
      if: ${{ always() && inputs.upload-artifact == 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.report-path.outputs.path }}
        if-no-files-found: error
        retention-days: 90
        include-hidden-files: true

    - name: Enforce governance result
      if: ${{ steps.governance.outcome == 'failure' }}
      shell: bash
      run: exit 1
