name: Code-Warden Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality-gate:
    name: Code-Warden Quality Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: code-warden/package.json

      - name: Governance report
        uses: ./
        with:
          path: code-warden
          artifact-name: code-warden-report
          sarif: 'true'
          sarif-file: code-warden.sarif

      - name: External npx smoke test
        working-directory: code-warden
        run: npm run smoke:npx
